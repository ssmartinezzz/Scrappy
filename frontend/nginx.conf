# Fashion Scraper Argentina — nginx config for the frontend Docker image
# (docker-install-alternative). SPA fallback so client-side routes (e.g.
# /catalogo, /picks/:categoria) resolve to index.html instead of 404.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
