# Fashion Scraper Argentina — nginx config for the frontend Docker image
# (docker-install-alternative). SPA fallback so client-side routes (e.g.
# /catalogo, /picks/:categoria) resolve to index.html instead of 404.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers. nginx drops server-level add_header inside any location
    # that declares its own, and both locations below do, so they are repeated
    # in each. `always` emits them on error responses too.
    #
    # frame-ancestors 'none' blocks clickjacking (the modern equivalent of
    # X-Frame-Options, kept for older browsers). A full script/style/connect CSP
    # is intentionally NOT set here: the SPA talks to a build-time-configurable
    # API origin (VITE_API_BASE_URL / window.__API_BASE__) and loads images from
    # arbitrary scraped shops, so an untested restrictive policy would break the
    # app in production. Tighten it per deployment, e.g.:
    #   add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; connect-src 'self' https://your-api; frame-ancestors 'none'; base-uri 'self'" always;

    # Content-hashed by the build: never revalidated. A missing chunk is a 404,
    # not the SPA page, so a stale reference can never be cached as HTML.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # index.html and config.js keep their names across builds: always revalidate.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
