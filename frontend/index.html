<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FBF7EF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16130F" media="(prefers-color-scheme: dark)">
  <script>
    // Applies the saved/OS theme before first paint (mirrors hooks/useTheme.js).
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var r = document.documentElement;
        if (t === 'dark') r.classList.add('dark');
        r.style.colorScheme = t;
        var c = t === 'dark' ? '#16130F' : '#FBF7EF', m = document.querySelectorAll('meta[name="theme-color"]');
        for (var el of m) el.setAttribute('content', c);
      } catch (e) {
        // Storage blocked (private mode): keep the CSS default, light; useTheme retries on mount.
      }
    })();
  </script>
  <meta name="apple-mobile-web-app-title" content="Scrappy">
  <title>Scrappy</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
  <div id="root"></div>
  <script src="/config.js"></script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
