# Optional Grafana over the scraper's Postgres. Nothing in the app needs it.
# Use scripts/observability.sh — it creates observability/grafana.env and picks the mode.
#
# Its own file, not a profile in docker-compose.yml: compose interpolates every
# service in a file, selected or not, so a profile there would demand the
# backend's ${AUTH_JWT_SECRET:?} & co. just to start Grafana.
#
# Two modes, same file:
#   native (default) — backend runs on the host, DB reachable at
#                      host.docker.internal:5432 (scripts/dev-db.sh, or a local PG).
#   stack            — merged with docker-compose.yml; GRAFANA_DB_HOST=postgres.
# Paths below are relative to the repo root, which is the project directory in
# both modes.
services:
  # One-shot: creates/updates the read-only `grafana_ro` login, then exits.
  # Uses the DB superuser from the root .env (DATABASE_USERNAME/PASSWORD), the
  # same credentials the backend already has.
  grafana-db-init:
    image: postgres:16-alpine
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PGHOST: ${GRAFANA_DB_HOST:-host.docker.internal}
      PGPORT: ${GRAFANA_DB_PORT:-5432}
      PGDATABASE: ${GRAFANA_DB_NAME:-scraper}
      PGUSER: ${DATABASE_USERNAME:-postgres}
      PGPASSWORD: ${DATABASE_PASSWORD:-postgres}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?falta GRAFANA_DB_PASSWORD — usá scripts/observability.sh}
    volumes:
      - ./observability/postgres/grafana-readonly.sql:/grafana-readonly.sql:ro
    entrypoint:
      - sh
      - -c
      - |
        i=0
        until pg_isready -q; do
          i=$$((i + 1)); [ $$i -ge 30 ] && { echo "Postgres no responde en $$PGHOST:$$PGPORT"; exit 1; }
          sleep 2
        done
        psql -v ON_ERROR_STOP=1 -q -f /grafana-readonly.sql
        # stdin, not -c: psql only interpolates :'pw' in scripts.
        echo "ALTER ROLE grafana_ro PASSWORD :'pw';" | psql -v ON_ERROR_STOP=1 -q -v pw="$$GRAFANA_DB_PASSWORD"
        echo "grafana_ro listo en $$PGHOST:$$PGPORT/$$PGDATABASE"

  grafana:
    image: grafana/grafana-oss:12.1.1
    restart: unless-stopped
    depends_on:
      grafana-db-init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Only read on the FIRST boot; after that the password lives in the
      # grafana-data volume. `scripts/observability.sh reset-admin` changes it.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?falta GRAFANA_ADMIN_PASSWORD — usá scripts/observability.sh}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/scrappy-scraper.json
      # Read by provisioning/datasources/scrappy-postgres.yml.
      GRAFANA_DB_HOST: ${GRAFANA_DB_HOST:-host.docker.internal}
      GRAFANA_DB_PORT: ${GRAFANA_DB_PORT:-5432}
      GRAFANA_DB_NAME: ${GRAFANA_DB_NAME:-scraper}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    # Loopback by default, on purpose separate from BIND_HOST: serving the app
    # to the LAN must not also serve the admin panel of your database.
    ports:
      - "${GRAFANA_BIND_HOST:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 512m

volumes:
  grafana-data:
