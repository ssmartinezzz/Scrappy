  Verify phase (2026-07-26): FAILED. sdd-verify ran the full pytest suite
  twice (67/67 with textual installed, 55 passed/2 skipped without —
  matching apply-progress's claims exactly) and confirmed 20/22 spec
  scenarios genuinely compliant with real passing tests, plus the seam
  invariant (installer never builds; CLI never provisions toolchain) and
  legacy launcher deletion. ONE CRITICAL blocker found and empirically
  reproduced: `cli/core/builder.py`'s VITE_API_BASE_URL Build-Time Export
  Ordering does NOT work against this repo's REAL `.env.example` files —
  builder.py/env_file.py only read/write the root `.env.example`/`.env`,
  but this repo's real root `.env.example` does not contain
  `VITE_API_BASE_URL` as an active key (it lives only in the separate
  `frontend/.env.example`, itself commented out by default — a pre-existing
  split from `decouple-services-postgres`) and `APP_OPEN_URL` is commented
  out too. Ran `generate_env()` directly against the real `.env.example` in
  this session: the resulting `.env` has 5 of the 7 spec-required keys, not
  7 — VITE_API_BASE_URL and APP_OPEN_URL are silently omitted. Consequence:
  the CLI's `build` action would break `vite build` (which fails fast
  without a real `VITE_API_BASE_URL` process env var) against the real
  repo — the exact hazard this change's headline feature claims to solve.
  The passing unit test (`test_vite_api_base_url_present_in_env_before_npm_run_build`)
  is a false positive: it fabricates a synthetic `.env.example` with
  VITE_API_BASE_URL as an active key, not matching real project state.
  Full detail, evidence, and suggested fix paths in verify.md. `verify`
  stays in phases_pending; NOT advanced to phases_completed. Engram
  disconnected this session — persisted to disk only.

