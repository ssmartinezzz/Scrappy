# Fashion Scraper Argentina — docker-install-alternative
#
# Additive bring-up path: `docker compose up` starts postgres + backend +
# frontend, all mutually reachable. Does not replace or modify
# INSTALAR_Y_CORRER.bat / Ejecutar_instalar.sh / the native CLI (cli/,
# native-cli-installer 2026-07-25 — supersedes the retired menu.ps1/menu.sh).
#
# Copy docker.env.example to .env (gitignored) before running, or export the
# same vars in your shell. See docker.env.example for the full documented
# list (functionally what the design calls ".env.docker" — see that file's
# header comment for why it is committed under this filename instead).
#
# External Postgres override: to point at an external/managed Postgres
# instance instead of the bundled `postgres` service below, either
# 1) create docker-compose.override.yml (see docker-compose.override.yml.example)
#    that removes the `postgres` service and backend's `depends_on`, or
# 2) leave the bundled service running but simply set DATABASE_URL/
#    DATABASE_USERNAME/DATABASE_PASSWORD in your .env to the external host —
#    the backend does not require the bundled service to be the one it talks
#    to, it only requires the env vars to resolve to a reachable Postgres.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scraper}
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres} -d ${POSTGRES_DB:-scraper}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The backend runs as uid 1000 (pwuser), but a models/logs volume created by
  # an older, root backend is root's. This one-shot hands only the entries that
  # are not uid 1000's yet, then exits; the backend image itself never runs as root.
  volume-permissions:
    image: busybox:1.37
    user: "0"
    command: ["sh", "-c", "find /models /app/logs ! -user 1000 -exec chown 1000:1000 {} +"]
    volumes:
      - models:/models
      - logs:/app/logs

  # Resuelve el managed challenge de Cloudflare para los sitios marcados con
  # sitio.<nombre>.cloudflare=true (hoy fullh4rd). Corre un Chromium propio; el
  # backend le pide UN clearance por run y lo replica en su contexto de Playwright.
  # Mismo NAT saliente que el backend, así que el cf_clearance atado a IP se mantiene.
  flare-solverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flare-solverr
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      TZ: America/Argentina/Buenos_Aires
    # Chromium se cae sin shm suficiente en el default de 64MB.
    shm_size: 1g
    ports:
      - "${BIND_HOST:-127.0.0.1}:8191:8191"
    mem_limit: 1g

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      volume-permissions:
        condition: service_completed_successfully
      flare-solverr:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/scraper}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      # Auth secrets. `RequiredEnvVarsGuard.REQUIRED_SECRETS` demands all five,
      # present AND non-blank, under the default profile — without them the
      # backend aborts at startup and the container crash-loops.
      #
      # `${VAR:?}` on purpose, not `:-`: compose refuses to start and names the
      # missing variable, instead of handing the JVM a blank that fails later and
      # deeper. There is no safe default to invent for a signing secret.
      #
      # These have to be listed HERE even though docker.env.example documents
      # them: `.env` only interpolates `${...}` placeholders that literally
      # appear in this file. Filling docker.env.example exactly as documented and
      # running `docker compose up` used to crash-loop for precisely this reason.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?falta AUTH_JWT_SECRET — copiá docker.env.example a .env}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:?falta ADMIN_BOOTSTRAP_USERNAME}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:?falta ADMIN_BOOTSTRAP_PASSWORD}
      CLI_SERVICE_ACCOUNT_USERNAME: ${CLI_SERVICE_ACCOUNT_USERNAME:?falta CLI_SERVICE_ACCOUNT_USERNAME}
      CLI_SERVICE_ACCOUNT_PASSWORD: ${CLI_SERVICE_ACCOUNT_PASSWORD:?falta CLI_SERVICE_ACCOUNT_PASSWORD}
      # Reset links must point at the FRONTEND's Docker origin (:8080), not the
      # :5173 of the portable install — a link to the wrong port is a reset that
      # silently goes nowhere.
      PASSWORD_RESET_CHANNEL: ${PASSWORD_RESET_CHANNEL:-console}
      PASSWORD_RESET_LINK_BASE: ${PASSWORD_RESET_LINK_BASE:-http://localhost:8080}
      # PASSWORD_RESET_CHANNEL=smtp lo requiere para el reseteo; los avisos de baja
      # de precio lo usan con sólo setear SMTP_HOST. Vacío: todo sigue en consola.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_STARTTLS_REQUIRED: ${SMTP_STARTTLS_REQUIRED:-true}
      # Avisos de baja de precio: se envían por SMTP cuando SMTP_HOST está seteado.
      NOTIFICACIONES_ENABLED: ${NOTIFICACIONES_ENABLED:-true}
      NOTIFICACIONES_INTERVALO_MS: ${NOTIFICACIONES_INTERVALO_MS:-15000}
      NOTIFICACIONES_LOTE: ${NOTIFICACIONES_LOTE:-200}
      NOTIFICACIONES_MAX_INTENTOS: ${NOTIFICACIONES_MAX_INTENTOS:-5}
      NOTIFICACIONES_LEASE_SEGUNDOS: ${NOTIFICACIONES_LEASE_SEGUNDOS:-300}
      NOTIFICACIONES_BACKOFF_BASE_SEGUNDOS: ${NOTIFICACIONES_BACKOFF_BASE_SEGUNDOS:-60}
      NOTIFICACIONES_MAX_POR_MINUTO: ${NOTIFICACIONES_MAX_POR_MINUTO:-60}
      NOTIFICACIONES_API_BASE_URL: ${NOTIFICACIONES_API_BASE_URL:-http://localhost:3000}
      NOTIFICACIONES_RETENCION_DIAS: ${NOTIFICACIONES_RETENCION_DIAS:-30}
      NOTIFICACIONES_PURGA_CADA_HORAS: ${NOTIFICACIONES_PURGA_CADA_HORAS:-6}
      SCRAPER_MODELS_ROOT: /models
      HF_HOME: /models/marqo
      LOG_DIR: /app/logs
      # El jar hornea localhost:8191 en config.properties; dentro de la red de
      # compose el solver es otro contenedor, así que pisa la property con el
      # nombre del servicio.
      SCRAPER_FLARESOLVERR_URL: ${SCRAPER_FLARESOLVERR_URL:-http://flare-solverr:8191}
    # Loopback by default: the API (login, password reset) must not be exposed
    # to the whole LAN unless asked. Set BIND_HOST=0.0.0.0 to serve other devices.
    ports:
      - "${BIND_HOST:-127.0.0.1}:3000:3000"
    volumes:
      - models:/models
      - logs:/app/logs
    # 8 parallel Chromium instances (~150-300MB each) + JVM + CPU torch;
    # tune per host if scraper.threads.paralelos changes.
    mem_limit: 3g

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${BIND_HOST:-127.0.0.1}:8080:8080"

volumes:
  pgdata:
  models:
  logs:
