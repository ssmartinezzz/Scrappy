# Fashion Scraper Argentina — docker-install-alternative
#
# Additive bring-up path: `docker compose up` starts postgres + backend +
# frontend, all mutually reachable. Does not replace or modify
# INSTALAR_Y_CORRER.bat / Ejecutar_instalar.sh / the native CLI (cli/,
# native-cli-installer 2026-07-25 — supersedes the retired menu.ps1/menu.sh).
#
# Copy docker.env.example to .env (gitignored) before running, or export the
# same vars in your shell. See docker.env.example for the full documented
# list (functionally what the design calls ".env.docker" — see that file's
# header comment for why it is committed under this filename instead).
#
# External Postgres override: to point at an external/managed Postgres
# instance instead of the bundled `postgres` service below, either
# 1) create docker-compose.override.yml (see docker-compose.override.yml.example)
#    that removes the `postgres` service and backend's `depends_on`, or
# 2) leave the bundled service running but simply set DATABASE_URL/
#    DATABASE_USERNAME/DATABASE_PASSWORD in your .env to the external host —
#    the backend does not require the bundled service to be the one it talks
#    to, it only requires the env vars to resolve to a reachable Postgres.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scraper}
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres} -d ${POSTGRES_DB:-scraper}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/scraper}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      # Auth secrets. `RequiredEnvVarsGuard.REQUIRED_SECRETS` demands all five,
      # present AND non-blank, under the default profile — without them the
      # backend aborts at startup and the container crash-loops.
      #
      # `${VAR:?}` on purpose, not `:-`: compose refuses to start and names the
      # missing variable, instead of handing the JVM a blank that fails later and
      # deeper. There is no safe default to invent for a signing secret.
      #
      # These have to be listed HERE even though docker.env.example documents
      # them: `.env` only interpolates `${...}` placeholders that literally
      # appear in this file. Filling docker.env.example exactly as documented and
      # running `docker compose up` used to crash-loop for precisely this reason.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?falta AUTH_JWT_SECRET — copiá docker.env.example a .env}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:?falta ADMIN_BOOTSTRAP_USERNAME}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:?falta ADMIN_BOOTSTRAP_PASSWORD}
      CLI_SERVICE_ACCOUNT_USERNAME: ${CLI_SERVICE_ACCOUNT_USERNAME:?falta CLI_SERVICE_ACCOUNT_USERNAME}
      CLI_SERVICE_ACCOUNT_PASSWORD: ${CLI_SERVICE_ACCOUNT_PASSWORD:?falta CLI_SERVICE_ACCOUNT_PASSWORD}
      # Reset links must point at the FRONTEND's Docker origin (:8080), not the
      # :5173 of the portable install — a link to the wrong port is a reset that
      # silently goes nowhere.
      PASSWORD_RESET_CHANNEL: ${PASSWORD_RESET_CHANNEL:-console}
      PASSWORD_RESET_LINK_BASE: ${PASSWORD_RESET_LINK_BASE:-http://localhost:8080}
      # Ignored unless PASSWORD_RESET_CHANNEL=smtp; blank defaults keep the
      # console channel working with nothing set.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SCRAPER_MODELS_ROOT: /models
      HF_HOME: /models/marqo
      LOG_DIR: /app/logs
    ports:
      - "3000:3000"
    volumes:
      - models:/models
      - logs:/app/logs
    # 8 parallel Chromium instances (~150-300MB each) + JVM + CPU torch;
    # tune per host if scraper.threads.paralelos changes.
    mem_limit: 3g

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  models:
  logs:
