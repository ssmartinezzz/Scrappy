# Perfil `test` — lo activa surefire para todo el JVM de tests
# (spring.profiles.active=test en pom.xml), no una anotación.
#
# RequiredEnvVarsGuard se saltea con este perfil, pero saltear el guard NO
# resuelve los placeholders: cualquier test que levante un contexto de Spring
# construye TokenService, y `${auth.jwt.secret}` sin valor rompe el contexto
# con un error de placeholder en vez de con el mensaje del guard.
#
# Este secreto es de juguete y sólo existe acá. Tiene 32+ bytes porque
# TokenService rechaza menos que eso, que es exactamente el comportamiento que
# queremos ejercitar, no evitar.
auth.jwt.secret=secreto-de-test-de-mas-de-32-bytes-para-hs256

admin.bootstrap.username=admin-test
admin.bootstrap.password=password-de-test-no-placeholder
cli.service-account.username=cli-test
cli.service-account.password=password-de-cli-de-test

password.reset.channel=console
password.reset.link-base=http://localhost:5173
smtp.host=
smtp.port=587
smtp.username=
smtp.password=
smtp.from-address=
