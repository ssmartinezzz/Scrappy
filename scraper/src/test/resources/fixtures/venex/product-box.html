<div class="item ">
<div class="product-box">
    <div class="product-box-media">
        <a href="{url}" onclick='enhancedClick({"id":"{id}","name":"{name}","category":"{category}","brand":"{brand}","price":"{price}","list":"Listado de Productos","position":"{position}"})' >
            <div class="thumb"><img src="products_images/thumb/{id}_1.jpg" class="img-contained" alt="{name}"></div>
        </a>
    </div>
    <div class="product-box-body clearfix">
        <h3 class="product-box-title">
            <a href="{url}" onclick='enhancedClick({"id":"{id}","name":"{name}","category":"{category}","brand":"{brand}","price":"{price}","list":"Listado de Productos","position":"{position}"})' >{name}</a>
        </h3>
        <a class="product-box-price clearfix" href="{url}">
            <span class="current-price">{priceText}</span>
        </a>
    </div>
</div>
</div>
