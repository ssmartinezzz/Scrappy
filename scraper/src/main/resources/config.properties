# Morashop — suplementos (Tiendanube, plataforma propia MORASHOP)
# La URL es la SECCION /suplementos/, no /productos/: en esta tienda
# /productos/ es una landing del tema con CERO productos, y /suplementos/ es
# el indice cuyas hojas MorashopPage descubre en runtime. Apuntar a
# /productos/ daria 0 productos en silencio.
# Morashop tambien vende supermercado, electro-hogar y bodega; ninguno mapea a
# un valor de `rubro`, por eso solo se crawlea esta seccion.
sitio.morashop.url=https://www.morashop.ar/suplementos/
sitio.morashop.activo=true
sitio.morashop.rubro=suplementos

