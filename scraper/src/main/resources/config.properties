sitio.inpro.activo=true
sitio.inpro.rubro=oficina

# ZENTRA — sillas ergonómicas y standing desks, mismo catálogo que INPRO pero
# Tiendanube CLÁSICO (a diferencia de inpro, que es headless). 44 productos,
# todos en una sola página: ?page=2 sirve una página vacía y el corte por dos
# vacías seguidas de TiendanubePage para solo. Medido 2026-08-26.
sitio.zentra.url=https://zentra.com.ar/productos/
sitio.zentra.activo=true
sitio.zentra.rubro=oficina
