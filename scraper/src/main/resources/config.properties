# ============================================================
#  Fashion Scraper - Configuracion
# ============================================================

precio.minimo=0
# 5.000.000 desde add-inpro-office-store. Era 300.000, y esa banda dejaba
# afuera el 32% del catalogo de INPRO (todas las sillas ergonomicas de gama
# y todos los standing desks salvo tres) y el 34% del de Maximus. La banda
# es GLOBAL: no hay override por sitio, asi que subirla alcanza a los 24.
precio.maximo=5000000
moneda=ARS
threads.paralelos=8
timeout.ms=30000
headless=true

# ---- Shopify ----
sitio.freres.url=https://freres.ar/collections/all
sitio.freres.activo=true

# ---- Tiendanube ----
sitio.harvey.url=https://www.harveywillys.com/productos/
sitio.harvey.activo=true
# Colección de temporadas anteriores (outlet) — pagina con ?mpage=N, no ?page=N.
# Se crawlea bajo el mismo sitio "Harvey"; el dedup por sitio+nombre colapsa lo
# que también aparezca en /productos/.
sitio.harvey.urls_extra=https://www.harveywillys.com/otras-temporadas1?mpage=1

